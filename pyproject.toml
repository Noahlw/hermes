[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Hermes — codebase indexer, persona contracts, and discord agent plugin"
readme = "README.md"
# >=3.11: upstream hermes-agent ships its venv on 3.11 (installer pins
# PYTHON_VERSION=3.11), and this repo is installed -e into that venv.
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psycopg2-binary>=2.9",
    "mcp>=1.2,<2",  # gateway targets the FastMCP 1.2 API; mcp 2.x moved it
]

[project.scripts]
hermes-indexer = "hermes.indexer.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes*"]
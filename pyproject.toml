[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Hermes — codebase indexer, persona contracts, and discord agent plugin"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
hermes-indexer = "hermes.indexer.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes*"]
